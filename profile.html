<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERTONE — Страница автора</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f2ea;color:#39343b;font:16px/1.5 "DM Sans",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:1px solid #e5ded6}header a{color:inherit;text-decoration:none}.brand{font:500 20px "Playfair Display",serif;letter-spacing:.1em}
main{max-width:1000px;margin:0 auto;padding:40px 5vw 80px}
.top{text-align:center;margin-bottom:34px}.av{width:84px;height:84px;border-radius:50%;background:#e8e1f0;display:grid;place-items:center;margin:0 auto 14px;font:500 34px "Playfair Display",serif}
h1{font:400 clamp(30px,5vw,44px) "Playfair Display",serif;margin:0}.bio{color:#77716f;margin:6px 0 0}.cnt{font-size:12px;letter-spacing:.16em;color:#89817f;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{text-decoration:none;color:inherit;background:#fffefb;border:1px solid #e5ded6;overflow:hidden;transition:.25s;display:block}.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #3a34401a}
.ph{height:180px;background-size:cover;background-position:center}.t{padding:12px 14px}.t strong{font:400 18px/1.25 "Playfair Display",serif;display:block}.t small{color:#89817f}
.empty{text-align:center;color:#77716f}
</style>
</head>
<body>
<header><a class="brand" href="index.html">AFTERTONE</a><a href="dashboard.html" id="mine" style="font-size:14px">Мой дневник</a></header>
<main>
  <div class="top"><div class="av" id="av">A</div><h1 id="name">…</h1><p class="bio" id="bio"></p><div class="cnt" id="cnt"></div></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none">Здесь пока нет открытых воспоминаний.</p>
</main>
<script>
const u = new URLSearchParams(location.search).get("u");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (!localStorage.getItem("aftertone_token")) mine.textContent = "Войти", mine.href = "vhod.html";
(async () => {
  try {
    const r = await fetch("/api/u/" + encodeURIComponent(u));
    if (!r.ok) throw 0;
    const d = await r.json();
    document.title = "AFTERTONE — " + d.profile.displayName;
    name.textContent = d.profile.displayName; bio.textContent = d.profile.bio || ""; av.textContent = d.profile.displayName.charAt(0).toUpperCase();
    cnt.textContent = `${d.total} ОТКРЫТЫХ ВОСПОМИНАНИЙ`;
    grid.innerHTML = d.items.map((c) => `<a class="card" href="share.html?s=${c.slug}"><div class="ph" style="background-image:url('${c.cover}'),linear-gradient(${(c.gradient || ["#ddd", "#bbb"]).join(",")})"></div><div class="t"><strong>${esc(c.title)}</strong><small>${new Date(c.date + "T12:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" })} · ${esc(c.moodLabel || "")}</small></div></a>`).join("");
    empty.style.display = d.items.length ? "none" : "block";
  } catch { document.querySelector("main").innerHTML = '<p class="empty">Такой страницы нет.</p>'; }
})();
</script>
</body>
</html>
